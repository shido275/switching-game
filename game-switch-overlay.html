<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Switch Overlay (Retro)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Palette: retro emulator × Fallout terminal (edit here if you like) ── */
    --techno-cyan:   #52ff9a;   /* primary CRT phosphor green */
    --magenta:       #ffc84d;   /* amber secondary (eyebrow / accents) */
    --amber:         #ffc84d;
    --phosphor:      #7dffb0;   /* pale green */
    --white:         #d7ffe8;   /* pale phosphor text */
    --dim:           #7fb39a;   /* dim green */
    --screen-bg:     #03140c;   /* CRT "off" green-black */
    --bezel:         #0f1a13;
    --bezel-hi:      #203b2c;
    --bezel-lo:      #050d08;

    --pixel-font: "Press Start 2P", "Courier New", monospace;
    --crt-font:   "VT323", "Courier New", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;   /* lets OBS show your game behind */
    color: var(--white);
  }

  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* ════════ Background: dot-matrix grid ════════ */
  .bg { position: absolute; inset: 0; background: transparent; }
  .bg::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(82,255,154,0.12) 1px, transparent 1.6px);
    background-size: 13px 13px;
    opacity: 0.7;
    animation: bg-scroll 4s linear infinite;
  }
  @keyframes bg-scroll { from { background-position: 0 0; } to { background-position: 0 26px; } }
  .bg::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  }

  /* ════════ The monitor — fills the full 1920x1080 canvas ════════ */
  .monitor {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    padding: 12px 14px 18px;
    border-radius: 12px;
    background: var(--bezel);
    box-shadow:
      inset 0 2px 0 var(--bezel-hi),
      inset 0 -3px 0 var(--bezel-lo),
      inset 2px 0 0 rgba(255,255,255,0.04),
      inset -2px 0 0 rgba(255,255,255,0.04),
      0 26px 60px rgba(0,0,0,0.6),
      0 0 0 2px #05070b;
  }

  /* screen */
  .screen {
    position: relative;
    background: var(--screen-bg);
    border-radius: 6px;
    padding: 38px 52px 26px;
    height: 100%;
    overflow: hidden;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.9), inset 0 0 130px rgba(82,255,154,0.05);
    opacity: 0;
    transform: translateY(12px);
    animation: screen-on 0.6s steps(6) forwards;
  }
  @keyframes screen-on { to { opacity: 1; transform: translateY(0); } }

  /* CRT scanlines + curvature shading */
  .crt {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background:
      repeating-linear-gradient(0deg,
        rgba(0,0,0,0.28) 0px, rgba(0,0,0,0.28) 1px,
        transparent 1px, transparent 4px);
    mix-blend-mode: multiply;
  }
  .crt-glow {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  /* bright sweep line every so often */
  .sweep {
    position: absolute; left: 0; right: 0; top: -10%; height: 10%;
    z-index: 7; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(82,255,154,0.05), transparent);
    animation: sweep 9s linear infinite;
  }
  @keyframes sweep { 0% { top: -15%; } 100% { top: 115%; } }

  /* ============ Screen content ============ */

  /* test-color bars strip */
  .colorbars {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px; z-index: 2;
    display: flex; opacity: 0.85;
  }
  .colorbars span { flex: 1; }
  .cb1{background:#1a9f5f;} .cb2{background:#ffc84d;} .cb3{background:#30d3ff;}

  /* topbar: marquee + cart label */
  .topbar {
    position: relative; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; margin-bottom: 20px;
  }
  .brand {
    font-family: var(--pixel-font);
    font-size: clamp(15px, 1.7vh, 24px); line-height: 1.5;
    letter-spacing: 1px;    color: var(--cyan, var(--techno-cyan));
    text-shadow: 0 0 8px rgba(82,255,154,0.7);
    white-space: nowrap;
  }
  .marquee-wrap {
    flex: 1; overflow: hidden; height: clamp(18px, 2.4vh, 28px);
    border: 1px solid rgba(82,255,154,0.4);
    background: rgba(82,255,154,0.06);
    position: relative;
  }
  .marquee {
    position: absolute; white-space: nowrap; top: 50%; transform: translateY(-50%);
    animation: marquee 16s linear infinite;
  }
  @keyframes marquee { from { left: 100%; } to { left: -160%; } }
  .marquee .m {
    display: inline-block;
    font-family: var(--crt-font); font-size: clamp(16px, 2.2vh, 26px);
    color: var(--techno-cyan);
    margin-right: 42px; letter-spacing: 1px;
  }

  /* the big cartridge graphic + title */
  .hero { position: relative; z-index: 3; display: flex; align-items: center; gap: clamp(28px, 3.4vw, 60px); }
  .cart-area { flex: 0 0 auto; }
  .cartridge {
    position: relative;
    width: clamp(66px, 6.4vw, 150px);
    height: auto; aspect-ratio: 98 / 78;
    background: linear-gradient(180deg, #12312a, #081a15);
    border: 3px solid #04120a;
    border-radius: 6px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.55), inset 0 2px 0 rgba(255,255,255,0.12);
    transform: translateX(140%);
    animation: cart-in 0.9s cubic-bezier(0.2,0.9,0.2,1) 0.5s forwards;
  }
  @keyframes cart-in { to { transform: translateX(0); } }
  .cartridge::before { /* top groove */
    content: ""; position: absolute; top: -3px; left: 12px; right: 12px; height: 8px;
    background: #6bffb0;
    border-radius: 2px 2px 4px 4px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.4);
    clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%);
  }
  .cartridge .label {
    position: absolute; inset: 20% 10px 15%;
    background: repeating-linear-gradient(180deg, #ffd24a, #ffd24a 4px, #e8b62d 4px, #e8b62d 8px);
    border-radius: 3px;
    padding-top: 12%; text-align: center;
    font-family: var(--pixel-font); font-size: clamp(13px, 1.6vh, 22px);
    line-height: 1.6; color: #5a3b00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }
  .cartridge.flicker { animation: cart-in 0.9s cubic-bezier(0.2,0.9,0.2,1) 0.5s forwards, cart-flicker 2.4s linear 1.4s infinite; }
  @keyframes cart-flicker { 0%,100% { opacity: 1; } 93% { opacity: 1; } 94% { opacity: 0.35; } 97% { opacity: 0.9; } }

  .hero-text { flex: 1 1 auto; min-width: 0; }
  .eyebrow {
    font-family: var(--pixel-font); font-size: clamp(15px, 2.1vh, 26px); letter-spacing: 3px;
    color: var(--magenta); margin-bottom: 18px;
    text-shadow: 0 0 10px rgba(255,200,77,0.7);
  }
  .eyebrow::after { content: "▌"; animation: blink-caret 1s steps(1) infinite; margin-left: 4px; }
  @keyframes blink-caret { 50% { opacity: 0; } }

  .title {
    font-family: var(--pixel-font);
    font-size: clamp(32px, min(4.8vw, 8.6vh), 100px);
    line-height: 1.28; letter-spacing: 1px;
  }
  .title .line { display: block; }
  .title .cyan { color: var(--white);
    text-shadow: 0 0 8px rgba(82,255,154,0.55), 0 3px 0 #00140b; }
  .title .pink { color: var(--magenta);
    text-shadow: 0 0 12px rgba(255,200,77,0.55), 0 3px 0 #170f00; }

  /* boot-line ticker */
  .boot {
    position: relative; z-index: 3;
    margin-top: 26px; height: clamp(28px, 3.4vh, 42px);
    font-family: var(--crt-font); font-size: clamp(20px, 2.8vh, 34px);
    color: var(--techno-cyan); white-space: nowrap; overflow: hidden;
    letter-spacing: 0.4px;
  }
  .boot.prompt::after { content: "▌"; color: var(--magenta); animation: blink-caret 0.8s steps(1) infinite; margin-left: 4px; }

  /* pixel loading bar */
  .loadzone { position: relative; z-index: 3; margin-top: 30px; }
  .load-label {
    display: flex; justify-content: space-between;
    font-family: var(--crt-font); font-size: clamp(16px, 2vh, 24px); color: var(--dim); letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .load-label .pct { color: var(--techno-cyan); }
  .pixelbar {
    display: flex; gap: 4px; height: clamp(26px, 3.2vh, 38px);
    font-family: "Courier New", monospace; font-size: clamp(18px, 2.4vh, 28px);
    line-height: 1;
  }
  .pixelbar i {
    flex: 0 0 3.6%;
    display: inline-block; text-align: center; color: var(--screen-bg);
    font-style: normal;
    background: linear-gradient(180deg, rgba(82,255,154,0.95), rgba(30,168,95,0.95));
    box-shadow: 0 0 8px rgba(82,255,154,0.6);
    opacity: 0; transform: scaleY(0.4);
  }
  .pixelbar i.fill { opacity: 1; transform: scaleY(1); transition: all 60ms steps(2); }

  /* corner screws on the bezel */
  .screw {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #6b7788, #232a33);
    box-shadow: inset -1px -1px 0 #0d0f13; z-index: 8;
  }
  .screw::after { content: ""; position: absolute; left: 2px; top: 4px; width: 5px; height: 1px; background: rgba(0,0,0,0.5); transform: rotate(-45deg); }
  .screw.tl{top:11px;left:14px;} .screw.tr{top:11px;right:14px;}
  .screw.bl{bottom:14px;left:14px;} .screw.br{bottom:14px;right:14px;}
</style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>

    <div class="monitor">
      <span class="screw tl"></span><span class="screw tr"></span>
      <span class="screw bl"></span><span class="screw br"></span>

      <div class="screen">
        <div class="crt"><div class="sweep"></div></div>
        <div class="crt-glow"></div>

        <!-- test color bars strip at bottom -->
        <div class="colorbars"><span class="cb1"></span><span class="cb2"></span><span class="cb3"></span><span class="cb2"></span><span class="cb1"></span><span class="cb3"></span><span class="cb1"></span><span class="cb3"></span></div>

        <div class="topbar">
          <div class="brand">TERM-<br>LINK</div>
          <div class="marquee-wrap"><div class="marquee" id="marquee"></div></div>
        </div>

        <div class="hero">
          <div class="cart-area">
            <div class="cartridge flicker">
              <div class="label">SWITCH<br>GAME</div>
            </div>
          </div>
          <div class="hero-text">
            <div class="eyebrow" id="eyebrow">PLEASE STAND BY</div>
            <div class="title">
              <div class="line cyan" id="line1">SWITCHING</div>
              <div class="line pink" id="line2">GAME</div>
            </div>
          </div>
        </div>

        <div class="boot" id="boot">SYS 24576  ↲</div>

        <div class="loadzone">
          <div class="load-label">
            <span>LOADING GAME DATA</span>
            <span class="pct" id="pct">0%</span>
          </div>
          <div class="pixelbar" id="pixelbar"></div>
        </div>

      </div>
    </div>
  </div>

<script>
  // ═══════════════════════════════════════════════════════════
  //  CONFIG — edit to customize without touching the CSS
  // ═══════════════════════════════════════════════════════════
  const CONFIG = {
    // Headline as two stacked lines. Line 2 renders in amber.
    line1: "SWITCHING",
    line2: "GAME",

    // Eyebrow label above the title
    eyebrow: "PLEASE STAND BY",

    // Marquee + boot ticker lines (Fallout terminal flavour)
    marquee: [
      "TERMINAL LINK ESTABLISHED",
      "LOADING GAME ASSETS",
      "PLEASE STAND BY",
      "NO SIGNAL — TRY SWITCHING CHANNELS",
    ],
    bootLines: [
      "> ROBCO INDUSTRIES (TM) TERMLINK PROTOCOL",
      "> ENTERING GAME...",
      "> CHECKING AUDIO... OK",
      "> INITIALIZING SAVE DATA... OK",
      "> CONNECTED — GOOD LUCK, OPERATOR",
    ],

    // Loading bar: how many pixels/blocks, interval (ms), then it loops
    barCells: 24,
    barInterval: 240,
  };

  // ── apply static text ──
  document.getElementById('line1').textContent   = CONFIG.line1;
  document.getElementById('line2').textContent   = CONFIG.line2;
  document.getElementById('eyebrow').textContent = CONFIG.eyebrow;

  // ── marquee ──
  const marqueeEl = document.getElementById('marquee');
  const mItems = (Array.isArray(CONFIG.marquee) && CONFIG.marquee.length)
      ? CONFIG.marquee : ["RETRO EMU ★ SWITCHING GAME"];
  marqueeEl.innerHTML = mItems.slice(0, 3).map(t =>
      `<span class="m">★ ${t}</span>`).join('');

  // ── boot ticker (typewriter, loops) ──
  const bootEl = document.getElementById('boot');
  const bItems = (Array.isArray(CONFIG.bootLines) && CONFIG.bootLines.length)
      ? CONFIG.bootLines : ["SYS 24576 ↲"];
  let bi = 0, ci = 0, typing = false;
  const typeLine = () => {
    const line = bItems[bi % bItems.length];
    bootEl.classList.add('prompt');
    typing = true;
    const iv = setInterval(() => {
      ci++;
      bootEl.textContent = line.slice(0, ci);
      if (ci >= line.length) {
        clearInterval(iv);
        typing = false;
        ci = 0;
        bi++;
        setTimeout(typeLine, 1100);   // pause between lines
      }
    }, 55);
  };
  typeLine();

  // ── pixel loading bar ──
  const barEl = document.getElementById('pixelbar');
  const pctEl = document.getElementById('pct');
  const cells = CONFIG.barCells;
  for (let i = 0; i < cells; i++) barEl.appendChild(document.createElement('i'));
  const fillIcons = ['█','▓','▒','░'];
  let filled = 0;
  const loadStep = () => {
    filled++;
    const el = barEl.children[(filled-1) % cells];
    el.textContent = fillIcons[(filled-1) % fillIcons.length];
    el.classList.add('fill');
    el.style.width = (0.6 + ((filled-1) % cells) / cells) + '%';
    pctEl.textContent = (filled % (cells+1)) + '%';
    if (filled % cells === 0) {           // finished a pass → wipe & reloop
      setTimeout(() => {
        Array.from(barEl.children).forEach(c => c.classList.remove('fill'));
        pctEl.textContent = '0%';
        filled = 0;
      }, 900);
    }
  };
  setInterval(loadStep, CONFIG.barInterval);
</script>
</body>
</html>
